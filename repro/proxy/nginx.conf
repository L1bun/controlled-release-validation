# Edge proxy for the validation stack.
# Runs as the unprivileged nginx user on a read-only root filesystem, so the
# pid file and every temp path live under /tmp (a tmpfs in docker-compose.yml).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    client_max_body_size 16k;

    # kept in separate files so a scenario can swap one piece (see scenarios/)
    include /etc/nginx/crv/upstream.conf;

    server {
        listen 8080;

        include /etc/nginx/crv/security-headers.conf;

        location / {
            limit_except GET POST {
                deny all;
            }

            proxy_pass http://notes_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }
    }
}
